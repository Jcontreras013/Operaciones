# Render Blueprint — despliega el backend (API) y el frontend (consola).
# El Postgres NO lo crea este Blueprint: se usa uno ya existente (creado a
# mano en el dashboard de Render, "New > PostgreSQL") — así evitamos que el
# Blueprint intente crear otro con el mismo nombre. `DATABASE_URL` se pega a
# mano (`sync: false`) con la **Internal Database URL** de esa base, una vez
# creado `operaciones-api` en la MISMA región que la base (las URLs internas
# de Render solo funcionan dentro de la misma región/red privada).
#
# Uso: en Render, New > Blueprint, apunta a este repositorio. Render propone
# los dos servicios. Completas las variables `sync: false` tras el primer
# deploy. Ver docs/deploy.md.

services:
  # ---------------- Backend (NestJS) ----------------
  - type: web
    name: operaciones-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon # misma región que la base (operaciones-db) — obligatorio para la URL interna
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pegar la "Internal Database URL" del Postgres ya creado (dashboard de
      # Render → tu base → Connections). Debe estar en la misma región.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SYNCHRONIZE
        value: 'false'
      # Corre las migraciones al arrancar (crea/actualiza el esquema).
      - key: DATABASE_MIGRATIONS_RUN
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: '1h'
      # URL del frontend, para CORS. Completar tras el primer deploy del static.
      - key: CORS_ORIGIN
        sync: false

  # ---------------- Frontend (Vite/React, estático) ----------------
  - type: web
    name: operaciones-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # URL absoluta de la API (https://operaciones-api.onrender.com).
      # Se completa tras el primer deploy del backend y se re-despliega el front.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta desconocida sirve index.html (routing en el cliente).
      - type: rewrite
        source: /*
        destination: /index.html
