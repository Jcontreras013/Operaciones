# Render Blueprint — despliega el backend (API) y el frontend (consola).
# PostgreSQL gestionado por Render: DATABASE_URL se cablea solo al backend
# (no hay que copiar cadena de conexión ni crear cuentas externas). Plan free:
# 1 GB. Para migrar a un Postgres externo más adelante, basta cambiar
# DATABASE_URL en el panel.
#
# Uso: en Render, New > Blueprint, apunta a este repositorio. Render crea la
# base y los dos servicios. Solo completas las URLs (`sync: false`) tras el
# primer deploy. Ver docs/deploy.md.

databases:
  - name: operaciones-db
    plan: free
    databaseName: operaciones
    user: operaciones

services:
  # ---------------- Backend (NestJS) ----------------
  - type: web
    name: operaciones-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Cadena de conexión del Postgres de Render (cableada automáticamente).
      - key: DATABASE_URL
        fromDatabase:
          name: operaciones-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SYNCHRONIZE
        value: 'false'
      # Corre las migraciones al arrancar (crea/actualiza el esquema).
      - key: DATABASE_MIGRATIONS_RUN
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: '1h'
      # URL del frontend, para CORS. Completar tras el primer deploy del static.
      - key: CORS_ORIGIN
        sync: false

  # ---------------- Frontend (Vite/React, estático) ----------------
  - type: web
    name: operaciones-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # URL absoluta de la API (https://operaciones-api.onrender.com).
      # Se completa tras el primer deploy del backend y se re-despliega el front.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta desconocida sirve index.html (routing en el cliente).
      - type: rewrite
        source: /*
        destination: /index.html
