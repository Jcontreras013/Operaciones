# Render Blueprint — despliega el backend (API) y el frontend (consola).
# La base de datos vive en Supabase (externa): se conecta por DATABASE_URL.
#
# Uso: en Render, New > Blueprint, apunta a este repositorio. Render crea los
# dos servicios. Luego completa las variables marcadas como `sync: false`
# (secretas o dependientes de URLs) en el panel. Ver docs/deploy.md.

services:
  # ---------------- Backend (NestJS) ----------------
  - type: web
    name: operaciones-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Cadena de conexión de Supabase (Settings > Database > Connection string,
      # URI). Secreta: se pega en el panel de Render.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SYNCHRONIZE
        value: 'false'
      # Corre las migraciones al arrancar (crea/actualiza el esquema).
      - key: DATABASE_MIGRATIONS_RUN
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: '1h'
      # URL del frontend, para CORS. Completar tras el primer deploy del static.
      - key: CORS_ORIGIN
        sync: false

  # ---------------- Frontend (Vite/React, estático) ----------------
  - type: web
    name: operaciones-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # URL absoluta de la API (https://operaciones-api.onrender.com).
      # Se completa tras el primer deploy del backend y se re-despliega el front.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta desconocida sirve index.html (routing en el cliente).
      - type: rewrite
        source: /*
        destination: /index.html
